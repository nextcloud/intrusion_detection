# Attaches a CycloneDX SBOM of the npm packages bundled into js/ to the
# release that appstore-build-publish.yml packages.

name: Release SBOM

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-latest

    # Releases are published from the nextcloud-releases repository
    if: ${{ github.repository_owner == 'nextcloud-releases' }}

    name: cyclonedx-sbom

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions
        with:
          fallbackNode: '^24'
          fallbackNpm: '^11.3'

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate the SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-reproducible --validate --output-format JSON --output-file "intrusion_detection-${GITHUB_REF_NAME}.cdx.json"

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "intrusion_detection-${GITHUB_REF_NAME}.cdx.json" --clobber --repo "$GITHUB_REPOSITORY"
