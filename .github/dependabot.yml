version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: saturday
    time: "03:00"
    timezone: Europe/Paris
  cooldown:
    default-days: 10
  commit-message:
    prefix: "build"
    include: "scope"
  versioning-strategy: "increase"
  open-pull-requests-limit: 10
  groups:
    patch-and-minor:
      update-types:
      - minor
      - patch
  labels:
  - 3. to review
  - dependencies
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
    timezone: Europe/Paris
  commit-message:
    prefix: "ci"
  labels:
  - 3. to review
  - dependencies
